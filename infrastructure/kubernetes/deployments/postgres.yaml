apiVersion: apps/v1
kind: Deployment
metadata:
  name: pairforge-postgres
  labels:
    app: pairforge-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pairforge-postgres
  template:
    metadata:
      labels:
        app: pairforge-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pairforge-config
                  key: postgres-password
            - name: POSTGRES_DB
              value: pairforge
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
