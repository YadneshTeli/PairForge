apiVersion: apps/v1
kind: Deployment
metadata:
  name: pairforge-api
  labels:
    app: pairforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pairforge-api
  template:
    metadata:
      labels:
        app: pairforge-api
    spec:
      containers:
        - name: api
          image: pairforge-api:local
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pairforge-config
                  key: database-url
            - name: REDIS_URL
              value: redis://pairforge-redis:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pairforge-config
                  key: jwt-secret
            - name: MATCHMAKING_URL
              value: http://pairforge-matchmaking:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
