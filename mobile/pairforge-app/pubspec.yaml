name: pairforge_app
description: PairForge - Developer Matching Platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.0.9
  go_router: ^17.1.0
  intl: ^0.20.2
  logger: ^2.4.0
  lottie: ^3.1.3
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
